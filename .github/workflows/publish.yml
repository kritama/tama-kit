name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'upmaru/tama-builder'
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./.codex-plugin/plugin.json').version")"

          test "$package_version" = "$plugin_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Validate Python inspector
        run: python3 -m py_compile skills/tama-graph-builder/scripts/inspect_tama_repository.py

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish
