name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kritama/tama-kit'
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./.codex-plugin/plugin.json').version")"

          test "$package_version" = "$plugin_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Validate JavaScript inspector
        run: node skills/graph-builder/scripts/inspect-tama-repository.mjs --help

      - name: Check formatting and lint
        run: npm run check

      - name: Type-check CLI
        run: npm run typecheck

      - name: Run Node test suite
        run: npm test

      - name: Validate packaged bootstrap, Compose, Terraform, and runtime
        run: npm run validate:bootstrap:runtime

      - name: Validate public submission metadata
        run: npm run validate:submission

      - name: Validate Template MCP review readiness
        run: npm run validate:review

      - name: Build plugin distribution archive
        run: npm run build:submission

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish
