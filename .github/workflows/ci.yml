name: CI

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, and type-check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.12.0", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript inspector
        run: node skills/graph-builder/scripts/inspect-tama-repository.mjs --help

      - name: Check formatting and lint
        run: npm run check

      - name: Type-check CLI
        run: npm run typecheck

      - name: Run Node test suite
        run: npm test

      - name: Validate public submission metadata
        run: npm run validate:submission

      - name: Validate package contents
        run: npm pack --dry-run

  bootstrap-integration:
    name: Bootstrap integration and runtime
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Validate packaged bootstrap, Compose, Terraform, and runtime
        run: npm run validate:bootstrap:runtime
