name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript inspector
        run: node skills/graph-builder/scripts/inspect-tama-repository.mjs --help

      - name: Type-check CLI
        run: npm run typecheck

      - name: Run Node test suite
        run: npm test

      - name: Validate public submission metadata
        run: npm run validate:submission

      - name: Validate package contents
        run: npm pack --dry-run
