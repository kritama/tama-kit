name: CI

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.12.0", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Restore installed dependencies
        id: dependency-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node }}-modules-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate JavaScript inspector
        run: node skills/graph-builder/scripts/inspect-tama-repository.mjs --help

      - name: Check formatting and lint
        run: npm run check

      - name: Type-check CLI
        run: npm run typecheck

      - name: Install Docker CLI and Compose for macOS configuration tests
        if: runner.os == 'macOS'
        run: |
          brew install docker docker-compose
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sf "$(brew --prefix)/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"

      - name: Verify native Compose configuration tooling
        run: docker compose version

      - name: Run Node test suite
        run: npm test

      - name: Report macOS native crashes
        if: failure() && runner.os == 'macOS'
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          for path in (Path.home() / "Library/Logs/DiagnosticReports").glob("node*.ips"):
              try:
                  text = path.read_text()
                  report = json.loads(text.split("\n", 1)[1])
                  print(json.dumps({
                      "report": path.name,
                      "exception": report.get("exception"),
                      "termination": report.get("termination"),
                      "frames": [frame.get("symbol") for thread in report.get("threads", [])
                                 if thread.get("triggered") for frame in thread.get("frames", [])]
                  }))
              except (ValueError, OSError):
                  pass
          PYTHON

      - name: Validate public submission metadata
        run: npm run validate:submission

      - name: Validate installed CLI package
        run: npm run validate:package

  env-recovery:
    name: Environment recovery (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        node: ["20.12.0", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macos-latest uses ARM runners without nested virtualization support.
      # Colima's own integration jobs use macos-15-intel for a real daemon.
      - name: Start isolated Docker daemon on macOS
        if: runner.os == 'macOS'
        run: |
          brew install colima docker docker-compose
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sf "$(brew --prefix)/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          colima start --runtime docker --cpu 2 --memory 4 --disk 20

      - name: Configure local HTTPS preview fixture names
        if: runner.os == 'macOS'
        run: |
          printf '127.0.0.1 app.localhost tama.app.localhost\n' | sudo tee -a /etc/hosts

      - name: Isolate public-image Docker client configuration
        if: runner.os == 'macOS'
        run: |
          fixture_docker_host="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          test -n "$fixture_docker_host"
          fixture_docker_config="$RUNNER_TEMP/tama-env-docker"
          mkdir -p "$fixture_docker_config/cli-plugins"
          # An explicit anonymous entry also prevents native credential-helper autodetection.
          printf '{"auths": {"https://index.docker.io/v1/": {}}}\n' > "$fixture_docker_config/config.json"
          ln -sf "$(brew --prefix)/bin/docker-compose" "$fixture_docker_config/cli-plugins/docker-compose"
          echo "DOCKER_HOST=$fixture_docker_host" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$fixture_docker_config" >> "$GITHUB_ENV"
          echo "DOCKER_CONTEXT=" >> "$GITHUB_ENV"

      - name: Verify Docker and native Compose
        run: |
          docker info
          docker compose version

      - name: Validate installed env recovery and persisted-data refusal
        run: npm run validate:env:runtime

      - name: Stop isolated Docker daemon
        if: always() && runner.os == 'macOS'
        run: |
          unset DOCKER_CONFIG DOCKER_HOST DOCKER_CONTEXT
          colima delete --data --force

  bootstrap-integration:
    name: Bootstrap integration and runtime
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Restore installed dependencies
        id: dependency-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-24-modules-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate packaged bootstrap, Compose, Terraform, and runtime
        run: npm run validate:bootstrap:runtime

      - name: Install local HTTPS certificate tooling
        run: sudo apt-get update && sudo apt-get install --yes mkcert libnss3-tools

      - name: Validate MCP App local HTTPS runtime
        run: npm run validate:mcp-app:runtime

      - name: Validate Compose-managed MCP App provider runtime
        run: node scripts/validate-mcp-app-local-https.mjs --compose-provider

      - name: Validate additive MCP App with host provider
        run: node scripts/validate-mcp-app-local-https.mjs --addition

      - name: Validate additive MCP App with Compose provider
        run: node scripts/validate-mcp-app-local-https.mjs --addition --compose-provider

  app-local-https-integration:
    name: App local HTTPS integration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Tama Kit
        uses: actions/checkout@v6

      - name: Check out pinned Memovee provider
        uses: actions/checkout@v6
        with:
          repository: kritama/memovee
          ref: c17f0cc240da860d8fa422cd2f286857723e3df7
          path: .runtime/memovee

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.19.5"

      - name: Install dependencies
        run: npm ci

      - name: Install local HTTPS certificate tooling
        run: sudo apt-get update && sudo apt-get install --yes mkcert libnss3-tools

      - name: Validate app provider and official Tama release together
        env:
          MEMOVEE_CHECKOUT: ${{ github.workspace }}/.runtime/memovee
        run: npm run validate:memovee:runtime
