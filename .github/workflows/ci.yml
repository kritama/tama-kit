name: CI

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Restore installed dependencies
        id: dependency-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-24-modules-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate JavaScript inspector
        run: node skills/graph-builder/scripts/inspect-tama-repository.mjs --help

      - name: Check formatting and lint
        run: npm run check

      - name: Type-check CLI
        run: npm run typecheck

      - name: Run Node test suite
        run: npm test

      - name: Validate public submission metadata
        run: npm run validate:submission

      - name: Validate package contents
        run: npm pack --dry-run

  bootstrap-integration:
    name: Bootstrap integration and runtime
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Restore installed dependencies
        id: dependency-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-24-modules-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate packaged bootstrap, Compose, Terraform, and runtime
        run: npm run validate:bootstrap:runtime

      - name: Install local HTTPS certificate tooling
        run: sudo apt-get update && sudo apt-get install --yes mkcert libnss3-tools

      - name: Validate MCP App local HTTPS runtime
        run: npm run validate:mcp-app:runtime

  memovee-local-https-integration:
    name: Memovee local HTTPS integration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Tama Kit
        uses: actions/checkout@v6

      - name: Check out pinned Memovee provider
        uses: actions/checkout@v6
        with:
          repository: kritama/memovee
          ref: 86226866acdad963324adb275b76d565f520f27c
          path: .runtime/memovee

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.16"
          elixir-version: "1.19.5"

      - name: Install dependencies
        run: npm ci

      - name: Install local HTTPS certificate tooling
        run: sudo apt-get update && sudo apt-get install --yes mkcert libnss3-tools

      - name: Validate Memovee dev and official Tama release together
        env:
          MEMOVEE_CHECKOUT: ${{ github.workspace }}/.runtime/memovee
        run: npm run validate:memovee:runtime
