# Generated by Tama Kit. Re-run `tama-kit bootstrap` to update this file.
services:
  tama-postgres:
    image: {{POSTGRES_IMAGE}}
    restart: unless-stopped
    env_file:
      - ../.tama.postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tama-postgres-data:/var/lib/postgresql/data
    labels:
      dev.upmaru.tama-kit.managed: "true"

  tama:
    image: {{TAMA_IMAGE}}
    restart: unless-stopped
    env_file:
      - ../.tama.env
    depends_on:
      tama-postgres:
        condition: service_healthy
    ports:
      - "{{PORT}}:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    labels:
      dev.upmaru.tama-kit.managed: "true"

volumes:
  tama-postgres-data:
    labels:
      dev.upmaru.tama-kit.managed: "true"
