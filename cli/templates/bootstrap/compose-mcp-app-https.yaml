# Generated by Tama Kit. Re-run `tama-kit bootstrap --mcp-app` to update this file.
services:
  tama-postgres:
    image: {{POSTGRES_IMAGE}}
    restart: unless-stopped
    env_file:
      - ./.tama.postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tama-postgres-data:/var/lib/postgresql/data
    labels:
      dev.upmaru.tama-kit.managed: "true"

  tama:
    build:
      context: .
      dockerfile: ./tama-local-ca.Dockerfile
    image: {{TAMA_LOCAL_IMAGE}}
    restart: unless-stopped
    env_file:
      - ./.tama.env
    depends_on:
      tama-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{{CONTAINER_PORT}}/"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    labels:
      dev.upmaru.tama-kit.managed: "true"

  caddy:
    image: {{CADDY_IMAGE}}
    restart: unless-stopped
    depends_on:
      tama:
        condition: service_healthy
    ports:
      - "127.0.0.1:{{HTTPS_PORT}}:{{HTTPS_PORT}}"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        aliases:
          - {{PROVIDER_HOST}}
          - {{TAMA_HOST}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/tama-kit/tls:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "--timeout=5", "https://localhost:{{HTTPS_PORT}}/"]
      interval: 5s
      timeout: 6s
      start_period: 5s
      retries: 12
    labels:
      dev.upmaru.tama-kit.managed: "true"

volumes:
  tama-postgres-data:
    labels:
      dev.upmaru.tama-kit.managed: "true"
